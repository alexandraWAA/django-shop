{% extends 'catalog/base.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-danger text-white">
                <h3 class="card-title mb-0">🗑️ Подтверждение удаления</h3>
            </div>
            <div class="card-body text-center">
                <p class="lead">Вы уверены, что хотите удалить статью?</p>
                <h4 class="text-danger">"{{ object.title }}"</h4>
                <p class="text-muted">Это действие невозможно отменить.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mt-4">
                        <a href="{% url 'blog:blog_list' %}" class="btn btn-secondary">Отмена</a>
                        <button type="submit" class="btn btn-danger">Да, удалить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
