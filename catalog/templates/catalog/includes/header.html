<!-- Шапка сайта -->
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">
        <a href="{% url 'catalog:home' %}" class="text-dark text-decoration-none">Skystore</a>
    </h5>
    <nav class="ms-5 d-flex gap-2 flex-wrap">
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}">Главная</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'blog:blog_list' %}">Блог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>

        {% if user.is_authenticated %}
            <a class="p-2 btn btn-outline-success" href="{% url 'catalog:product_create' %}">➕ Добавить товар</a>
            <div class="dropdown d-inline-block">
                <button class="p-2 btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                    👤 {{ user.first_name|default:user.email }}
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="{% url 'users:profile' %}">📋 Мой профиль</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="{% url 'users:logout' %}">🚪 Выйти</a></li>
                </ul>
            </div>
        {% else %}
            <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">🔐 Войти</a>
            <a class="p-2 btn btn-primary" href="{% url 'users:register' %}">📝 Регистрация</a>
        {% endif %}
    </nav>
</div>
